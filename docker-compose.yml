services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gympro-sqlserver
    env_file:
      - ${GYMPRO_ENV_FILE:-.env}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - gympro-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  gympro:
    build:
      context: .
      dockerfile: Dockerfile
    image: gympro-api:latest
    container_name: gympro-api
    env_file:
      - ${GYMPRO_ENV_FILE:-.env}
    ports:
      - "${APP_PORT:-5000}:5000"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

volumes:
  gympro-sqlserver-data:
